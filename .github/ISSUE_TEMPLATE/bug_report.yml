name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `wiremap --kube-context ...`
        2. Open ...
        3. See ...
  - type: input
    id: version
    attributes:
      label: Wiremap version
      placeholder: v0.x.y, or the commit if built from source
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Binary (install script or release)
        - Docker image
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: What were you looking at?
      options:
        - Docker
        - Kubernetes
        - Both
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Docker version, Kubernetes version and distribution (kind, EKS, k3s, ...).
  - type: textarea
    id: logs
    attributes:
      label: Wiremap logs
      description: Anything relevant from the terminal where Wiremap runs.
      render: text
